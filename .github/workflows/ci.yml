name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend
        run: dotnet restore JobParser.slnx --configfile NuGet.Config

      - name: Build backend
        run: dotnet build JobParser.slnx --configuration Release --no-restore

      - name: Test backend
        run: dotnet test JobParser.slnx --configuration Release --no-build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Validate Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Initialize Terraform without remote state
        working-directory: infrastructure/terraform/environments/personal
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: infrastructure/terraform/environments/personal
        run: terraform validate

      - name: Build deployment image
        run: docker build --platform linux/amd64 --tag jobparser-ci:${{ github.sha }} .
