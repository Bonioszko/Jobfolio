services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobparser
      POSTGRES_USER: jobparser
      POSTGRES_PASSWORD: jobparser
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jobparser-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobparser -d jobparser"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  jobparser-postgres:
